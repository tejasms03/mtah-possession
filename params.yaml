# Every threshold lives here. Record where each value came from in docs/DECISIONS.md.
# Starting values from physics; phase 0/1 measurements replace them.

clean:
  max_ball_speed_mps: 35.0       # hardest shots ~35 m/s
  max_player_speed_mps: 11.0     # fastest sprinters ~10 m/s
  position_tolerance_m: 0.5      # detection jitter allowed on top of max speed
  offpitch_margin_m: 5.0         # further outside the lines than this = junk
  ball_min_run_frames: 3         # shorter impossible detours are deleted
  duplicate_radius_m: 0.3        # two same-team detections closer than this = one player
  velocity_halfwindow_frames: 3  # player velocity over ±0.12 s

ball:
  max_bridge_frames: 12          # bridge gaps up to 0.48 s by interpolation; longer stay unknown
  savgol_window: 7               # Savitzky-Golay, 2nd order, 7 frames (Vidal-Codina et al. 2022)
  savgol_order: 2
  touch_half_window_frames: 3    # compare velocity 0.12 s before vs after
  touch_dv_mps: 3.0              # velocity change that counts as a touch (Tracab used 5; retune)
  touch_angle_deg: 25            # or a turn this sharp while moving (Tracab used 10; we are noisier)
  touch_min_speed_mps: 1.5       # angle test only when the ball moves at least this fast
  touch_radius_m: 2.0            # a player must be this close (1 m optical; wider for our noise)
  touch_min_separation_frames: 6 # one touch per 0.24 s at most

coupling:
  sigma_d_m: 1.2
  gate_d_m: 2.0
  sigma_v_mps: 2.5
  ballistic_speed_mps: 8.0

control:
  t_ctrl_s: 0.8                  # minimum controlled touch for a switch
  t_release_s: 0.3               # contested: incumbent must lose contact this long
  consecutive_touches: 2

dead_ball:
  out_margin_m: 0.5              # ball seen this far beyond a line = out
  still_speed_mps: 0.5           # ball slower than this = still
  speed_ref_mps: 2.0             # team mean speed below this leans dead (public window: D 1.1-1.5, live 2.2-3.5)
  w_speed: 2                   # log-odds per m/s below speed_ref
  w_out: 3.0
  w_still: 1.0
  w_fast_ball: 2.0               # a ball moving fast is in play
  fast_ball_mps: 8.0
  bias: -1.0

decode:
  temperature: 0.1               # scales all per-frame evidence (neighbouring frames are correlated)
  lambda_ha: 2                 # cost of an H<->A switch away from any touch
  lambda_ha_touch: 2           # ... within touch_window_frames of a detected touch
  touch_window_frames: 12
  lambda_d_exit: 4             # cost of leaving D away from a touch (restarts are kicks)
  lambda_d_exit_touch: 4       # ... within touch_window_frames of a touch
  lambda_d: 4                    # cost of entering D
  min_possession_frames: 10       # 0.4 s; the public GT has possessions as short as 0.8 s
  min_dead_frames: 50            # 2 s: 99% of dead spells in DFL, Metrica and the public GT last longer; not tuned
  w_touch: 10                  # log-odds for the touching team at a touch frame
  w_control: 0                 # per frame, ball within control_radius of one team and clear of the other
  control_radius_m: 1.5
  free_radius_m: 3.0
  w_tag_dead: 3.0                # Smart Tagging set piece: dead around its start
  tag_dead_before: 50
  tag_dead_after: 50
  w_tag_team: 2.0                # ... and the named team restarts
  tag_team_frames: 375           # 15 s after the tag start
  dead_before_kickoff: true      # only D between a half's start and its Kick Off (Start) tag
  refine: false                  # stage 6 snapping: off (bench -0.000..+0.001 at 1 s, worse at 2-3 s; GT switches precede our touches by 0.5-2 s)
  snap_s: 3.0
  snap_stop_after_s: 1.0
  switch_offset_frames: 0        # stage 6: measured lag correction

features:
  extra_team: true               # idea 2: heading, pressure, touch runs, last toucher (+0.012/+0.013 on whole-match select)
  team_windows_s: [0.4, 1, 2, 4]          # centred means for the whose-ball notes
  game_windows_s: [0.4, 1, 2, 4, 10, 40]   # dead-ball notes also need stoppage-length context

metrica:
  dead_max_s: 90                 # an event-derived dead spell never runs longer than this

selection:
  tag_lead_s: 3.0               # stand-in tags start this long before the Metrica restart event

idsse_bench:
  merge_blip_s: 2.0              # merge A-H-A blips shorter than this: 3.5 possessions/min vs public GT 3.4

model:
  seed: 0
  row_step: 5                    # train on every 5th graded frame
  learning_rate: 0.05
  max_iter: 300                  # trees
  max_leaf_nodes: 31
  min_samples_leaf: 300          # high: neighbouring frames are near copies
  l2: 1.0
  ensemble:
    size: 1                      # v14: single model set (5-member average tied on the whole-match bench)
    max_features: 0.8            # members only: share of features tried per split
  own:                           # weak dead/alive labels from our own match (Smart Tagging set pieces)
    use: false                   # trains on labels from the provided match: not allowed (organiser clarification, 3 Nov)
    tag_window_s: 2.0            # dead within +-2 s of each set-piece tag start
    live_clear_s: 20.0           # live examples at least this far from any set-piece tag
    live_ball_speed_mps: 5.0     # ... with the ball seen moving this fast
    live_max_pdead: 0.3          # ... and the outside-data model already saying live
    weight: 5.0                  # per-row weight vs outside-match rows
    combine: none                # none | mean3 | max: separate our-match dead model (A-own), averaged or either-or
    min_samples_leaf: 50         # A-own has ~1,200 dead rows, so smaller leaves
  own_team:                      # weak whose-ball labels from our own match (runs of same-team touches)
    use: false                   # v10: no gain on the bench; also trains on the provided match (not allowed)
    min_touches: 3               # at least this many consecutive touches by one team
    max_gap_s: 3.0               # ... no more than this apart
    clear_s: 5.0                 # away from any set-piece tag
    weight: 3.0
  dead_metrica_full: true        # average model A with a Metrica-only dead model that keeps ball motion
  dead_drop_prefixes: [ball_speed, ball_still_s, touch_since, touch_until, d1_min, n5_sum]  # DFL freezes the ball at stoppages
  w_dead: 0.5                    # decoder: weight on model A log-odds
  w_team: 1                    # decoder: weight on model B log-odds
  dead_bias: 1                 # decoder: shift on model A log-odds

idsse_degrade:                   # calibrated to BAR-ATH tactical ATD aggregates, see DECISIONS.md
  seed: 0
  ball_missing_share: 0.41       # BAR-ATH graded frames: 40.7%
  ball_gap_median_s: 10.7        # BAR-ATH ball gaps: median 10.7 s, p90 33.8 s
  ball_gap_sigma: 0.90           # lognormal; gives p90 ~34 s
  crowd_radius_m: 3.0
  crowd_gain: 0.35               # gap hazard x (1 + gain * extra players near the ball)
  air_height_m: 2.0
  air_gain: 3.0                  # gap hazard x this while the ball is above air_height_m
  frag_median_s: 60.0            # lands slot runs at ~22-30 s median (BAR-ATH 35 s)
  frag_sigma: 1.64
  gap_short_median_s: 1.0
  gap_short_sigma: 1.0
  gap_long_median_s: 20.0
  gap_long_sigma: 1.0
  gap_long_share: 0.45           # together: ~20.2 visible players/frame (BAR-ATH 20.5)
  dup_per_player_min: 0.12       # >22 visible on ~1-2% of frames (BAR-ATH 2.4%)
  dup_median_s: 2.0
  dup_sigma: 0.8
  dup_offset_m: 0.7
  pos_noise_m: 0.15
  speed_smooth_frames: 5
  speed_method: displacement     # changes the cache key: speeds() fixed 2026-11-12
