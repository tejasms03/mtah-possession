# Every threshold lives here. Record where each value came from in docs/DECISIONS.md.
# Starting values from physics; phase 0/1 measurements replace them.

clean:
  max_ball_speed_mps: 35.0       # hardest shots ~35 m/s
  max_player_speed_mps: 11.0     # fastest sprinters ~10 m/s
  position_tolerance_m: 0.5      # detection jitter allowed on top of max speed
  offpitch_margin_m: 5.0         # further outside the lines than this = junk
  ball_min_run_frames: 3         # shorter impossible detours are deleted
  duplicate_radius_m: 0.3        # two same-team detections closer than this = one player
  velocity_halfwindow_frames: 3  # player velocity over ±0.12 s

ball_filter:
  measurement_noise_m: null      # phase 0: measure ball jitter
  rolling_decel_mps2: null       # phase 1: IDSSE
  carried_radius_m: 1.5
  switch_prob: 0.02

coupling:
  sigma_d_m: 1.2
  gate_d_m: 2.0
  sigma_v_mps: 2.5
  ballistic_speed_mps: 8.0

control:
  t_ctrl_s: 0.8                  # minimum controlled touch for a switch
  t_release_s: 0.3               # contested: incumbent must lose contact this long
  consecutive_touches: 2

dead_ball:
  min_duration_s: null           # phase 0: shortest D run in the public GT
  restart_speed_mps: 3.0

decode:
  lambda_ha: null                # switch penalty H<->A
  lambda_d: null                 # penalty in/out of D
  switch_offset_frames: 0        # phase 0: GT switch timing vs first touch

model:
  window_s: 2.0
  seed: 0
  holdout_every_nth_minute: 5

idsse_degrade:                   # calibrated to BAR-ATH tactical ATD aggregates, see DECISIONS.md
  seed: 0
  ball_missing_share: 0.41       # BAR-ATH graded frames: 40.7%
  ball_gap_median_s: 10.7        # BAR-ATH ball gaps: median 10.7 s, p90 33.8 s
  ball_gap_sigma: 0.90           # lognormal; gives p90 ~34 s
  crowd_radius_m: 3.0
  crowd_gain: 0.35               # gap hazard x (1 + gain * extra players near the ball)
  air_height_m: 2.0
  air_gain: 3.0                  # gap hazard x this while the ball is above air_height_m
  frag_median_s: 60.0            # lands slot runs at ~22-30 s median (BAR-ATH 35 s)
  frag_sigma: 1.64
  gap_short_median_s: 1.0
  gap_short_sigma: 1.0
  gap_long_median_s: 20.0
  gap_long_sigma: 1.0
  gap_long_share: 0.45           # together: ~20.2 visible players/frame (BAR-ATH 20.5)
  dup_per_player_min: 0.12       # >22 visible on ~1-2% of frames (BAR-ATH 2.4%)
  dup_median_s: 2.0
  dup_sigma: 0.8
  dup_offset_m: 0.7
  pos_noise_m: 0.15
  speed_smooth_frames: 5
