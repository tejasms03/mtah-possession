[project]
name = "possession"
version = "0.1.0"
description = "Frame-level possession labelling (H/A/D) from automatic tracking data, BAR-ATH."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "kloppy",
    "lightgbm",
    "pyyaml",
    "matplotlib",
    "numba>=0.68.1",
]

[dependency-groups]
dev = ["pytest", "jupyterlab"]

[project.scripts]
possession = "possession.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/possession"]

[tool.pytest.ini_options]
testpaths = ["tests"]
